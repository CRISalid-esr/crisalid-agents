<circle cx="332" cy="328" r="16" fill="#7c5cbf"/>
<text x="332" y="335" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="332" dy="0">1</tspan></text>
<rect x="540" y="286" width="106" height="28" rx="14" fill="#7c5cbf"/>
<text x="553" y="306" font-size="16" fill="#ffffff" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="553" dy="0">prompted</tspan></text>
<text x="358" y="336" font-size="23" fill="#7c5cbf" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="358" dy="0">Query expansion</tspan></text>
<text x="318" y="368.2" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="318" dy="0">3 to 5 English queries, 5–15 words,</tspan><tspan x="318" dy="24.7">phrased like the work programme:</tspan><tspan x="318" dy="24.7">challenge, expected outcome,</tspan><tspan x="318" dy="24.7">research content</tspan></text>
<rect x="760" y="300" width="360" height="220" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="3"/>
<circle cx="792" cy="328" r="16" fill="#4b5563"/>
<text x="792" y="335" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="792" dy="0">2</tspan></text>
<text x="818" y="336" font-size="23" fill="#1f2430" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="818" dy="0">One tool call per query</tspan></text>
<text x="778" y="368.2" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="778" dy="0">search_horizon_topics(query,</tspan><tspan x="778" dy="24.7">  cluster?, type_of_action?)</tspan><tspan x="778" dy="24.7">issued in parallel, shown as</tspan><tspan x="778" dy="24.7">tool blocks in the chat</tspan></text>
<rect x="1190" y="300" width="420" height="220" rx="10" fill="#efe9f9" stroke="#7c5cbf" stroke-width="3"/>
<circle cx="1222" cy="328" r="16" fill="#7c5cbf"/>
<text x="1222" y="335" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1222" dy="0">3</tspan></text>
<rect x="1490" y="286" width="106" height="28" rx="14" fill="#7c5cbf"/>
<text x="1503" y="306" font-size="16" fill="#ffffff" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1503" dy="0">prompted</tspan></text>
<text x="1248" y="336" font-size="23" fill="#7c5cbf" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1248" dy="0">Merge and present</tspan></text>
<text x="1208" y="368.2" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1208" dy="0">topics hit by several queries first,</tspan><tspan x="1208" dy="24.7">why it fits = best-matching passage,</tspan><tspan x="1208" dy="24.7">says when the match is only</tspan><tspan x="1208" dy="24.7">thematic; never invents ids,</tspan><tspan x="1208" dy="24.7">dates or amounts</tspan></text>
<rect x="1650" y="300" width="250" height="220" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="3"/>
<text x="1668" y="336" font-size="23" fill="#1f2430" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1668" dy="0">get_horizon_topic</tspan></text>
<text x="1668" y="368.2" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1668" dy="0">full expected outcome,</tspan><tspan x="1668" dy="24.7">scope, conditions,</tspan><tspan x="1668" dy="24.7">budget, deadlines</tspan></text>
<rect x="760" y="590" width="300" height="190" rx="10" fill="#e3f4f4" stroke="#1f8a8a" stroke-width="3"/>
<text x="778" y="626" font-size="23" fill="#1f8a8a" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="778" dy="0">Embedding service</tspan></text>
<text x="778" y="658.2" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="778" dy="0">bge-m3, 1024 dims</tspan><tspan x="778" dy="24.7">query → vector</tspan><tspan x="778" dy="24.7">(the same model</tspan><tspan x="778" dy="24.7">embedded the index)</tspan></text>
<rect x="1190" y="590" width="710" height="190" rx="10" fill="#e3f4f4" stroke="#1f8a8a" stroke-width="3"/>
<rect x="1190" y="590" width="710" height="14" rx="7" fill="#1f8a8a"/>
<text x="1208" y="634" font-size="23" fill="#1f8a8a" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1208" dy="0">OpenSearch topic index</tspan></text>
<text x="1208" y="666" font-size="17" fill="#1f2430" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1208" dy="0">409 topics of the 2026-27 programme, one document per topic + one vector per section</tspan><tspan x="1208" dy="22.1">hybrid query: BM25 + topic vector + passage vectors, fused by reciprocal rank fusion</tspan><tspan x="1208" dy="22.1">built beforehand by the ingestion script from the work programme PDFs</tspan></text>
<rect x="300" y="850" width="1600" height="140" rx="10" fill="#efe9f9" stroke="#7c5cbf" stroke-width="3"/>
<text x="318" y="886" font-size="23" fill="#7c5cbf" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="318" dy="0">System prompt, used by steps 1 and 3 — the whole behaviour lives here</tspan></text>
<text x="318" y="918.2" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="318" dy="0">write the queries → call the search tool for each, without announcing them → merge → answer in the user's language,</tspan><tspan x="318" dy="24.7">shortlist only, no invented rules or links → for any follow-up on a topic, call get_horizon_topic first and quote its text</tspan></text>
