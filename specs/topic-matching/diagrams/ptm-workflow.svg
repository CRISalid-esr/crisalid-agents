<text x="1208" y="164" font-size="23" fill="#2f7d32" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1208" dy="0">Answer in the chat</tspan></text>
<text x="1208" y="196.2" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1208" dy="0">≤ 5 topics: id, title, call, deadline, EU</tspan><tspan x="1208" dy="24.7">contribution, one sentence on the fit</tspan></text>
<rect x="1650" y="128" width="250" height="112" rx="10" fill="#fff1e6" stroke="#f6a15b" stroke-width="3"/>
<text x="1668" y="164" font-size="23" fill="#f6a15b" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1668" dy="0">Follow-up</tspan></text>
<text x="1668" y="196.2" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="1668" dy="0">“budget? eligibility?”</tspan></text>
