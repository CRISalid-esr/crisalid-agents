<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="PTM workflow: a researcher asks the Horizon topic finder in the chat; the agent expands the question into English queries, searches the OpenSearch topic index once per query and answers with a shortlist" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
