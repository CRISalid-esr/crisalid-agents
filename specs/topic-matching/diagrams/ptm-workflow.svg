<text x="318" y="196.2" font-size="19" fill="#1f2430" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"><tspan x="318" dy="0">types a project idea: title or abstract,</tspan><tspan x="318" dy="24.7">in French or English</tspan></text>
