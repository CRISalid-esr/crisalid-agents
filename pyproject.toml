[project]
name = "crisalid-agents"
version = "0.1.0"
description = "Framework for building agents connected to CRISalid ecosystem with LangGraph and LangChain"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "langchain>=1.2.17",
    "langchain-core>=1.3.2",
    "langchain-neo4j>=0.9.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "toolbox-langchain>=1.0.0",
]

[project.optional-dependencies]
# Deps of the FastAPI wrapper (chat_api/) only. The OpenWebUI Pipelines image must
# NOT install these: its base image ships its own fastapi/uvicorn versions.
chat-api = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
