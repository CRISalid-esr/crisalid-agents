[project]
name = "crisalid-agents"
version = "0.1.0"
description = "Framework for building agents connected to CRISalid ecosystem with LangGraph and LangChain"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "langchain>=1.2.17",
    "langchain-core>=1.3.2",
    "langchain-neo4j>=0.9.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "toolbox-langchain>=1.0.0",
    "toolbox-core @ git+https://github.com/googleapis/mcp-toolbox-sdk-python.git#subdirectory=packages/toolbox-core",
    "uvicorn>=0.51.0",
    "dotenv>=0.9.9",
    "fastapi>=0.139.0",
    "passlib>=1.7.4",
    "jwt>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
