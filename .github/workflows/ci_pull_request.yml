name: crisalid-agents CI

on:
  pull_request:
    branches: [ "dev-main", "main" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra chat-api --extra topic-matching --extra trm

      - name: Test with pytest
        run: uv run pytest

  docker-build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build crisalid-agents-chat-api (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/chat-api.Dockerfile
          push: false
