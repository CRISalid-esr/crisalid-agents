name: CD Push release

on:
  push:
    tags:
      - 'v*.*.*'   # ex: v1.0.0

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          # remove leading 'v' from tag name to get version number
          VERSION="${GITHUB_REF_NAME#v}"   # v1.2.3 -> 1.2.3

          # extract major and minor versions
          MAJOR="${VERSION%%.*}"   # 1.2.3 -> 1
          MINOR="${VERSION%.*}"    # 1.2.3 -> 1.2

          # expose values as step outputs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push crisalid-agents-chat-api (release tags)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/chat-api.Dockerfile
          push: true
          tags: |
            crisalidesr/crisalid-agents-chat-api:${{ steps.version.outputs.version }}
            crisalidesr/crisalid-agents-chat-api:${{ steps.version.outputs.minor }}
            crisalidesr/crisalid-agents-chat-api:${{ steps.version.outputs.major }}
            crisalidesr/crisalid-agents-chat-api:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
